[project]
name = "modelherder"
version = "0.1.0"
description = "Inventory generative AI model files installed on your machine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=13.7",
]

[project.scripts]
modelherder = "modelherder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelherder"]
